[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podstudio"
dynamic = ["version"]
description = "Record a USB mic, fire hotkey sounds on their own track, and master to -16 LUFS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "soundfile>=0.12",
  "comtypes>=1.4; sys_platform == 'win32'", "pycaw; sys_platform == 'win32'"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Environment :: Win32 (MS Windows)",
  "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest", "pyloudnorm"]

[project.scripts]
podstudio = "podstudio.app:main"

[tool.setuptools]
packages = ["podstudio"]

[tool.setuptools.dynamic]
version = { attr = "podstudio.__version__" }

[tool.setuptools.package-data]
podstudio = ["data/*", "data/icons-theme/hicolor/scalable/actions/*.svg"]
