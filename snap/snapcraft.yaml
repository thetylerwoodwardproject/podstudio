# UNVERIFIED: written without being able to run snapcraft (it needs root, LXD or Multipass). Build with `snapcraft` on a
# machine that has them, or use the CI workflow in .github/workflows/packages.yml, and fix whatever the first build reports.
name: podstudio
title: PodStudio
base: core24
version: '2026.11.20'
summary: Recording console for the RØDE PodMic USB
description: |
  Record the PodMic USB, fire hotkey sounds from pads onto their own track, and export a stereo master normalized to
  podcast loudness (-16 LUFS, true peak at or below -1 dBTP). Includes on-board PodMic processing controls, DeepFilterNet
  noise reduction at render time, per-pad ducking, session recovery and upload to Buzzsprout as a private draft.

  Independent project. Not affiliated with, endorsed by, or sponsored by RØDE Microphones.

  To use the mic's on-board processing controls, connect the USB interface once:
    sudo snap connect podstudio:raw-usb
    sudo snap connect podstudio:hardware-observe
license: MIT
website: https://github.com/thetylerwoodwardproject/podstudio
contact: https://github.com/thetylerwoodwardproject/podstudio/issues
source-code: https://github.com/thetylerwoodwardproject/podstudio
issues: https://github.com/thetylerwoodwardproject/podstudio/issues
icon: data/io.github.thetylerwoodwardproject.PodStudio.svg
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  podstudio:
    command: bin/podstudio-launch
    extensions: [gnome]
    desktop: usr/share/applications/io.github.thetylerwoodwardproject.PodStudio.desktop
    common-id: io.github.thetylerwoodwardproject.PodStudio
    plugs:
      - audio-playback
      - audio-record            # the PodMic is a microphone
      - network                 # Buzzsprout uploads
      - home                    # sessions are saved in ~/Music/PodStudio
      - password-manager-service  # Buzzsprout token goes in the keyring
      - raw-usb                 # the mic's on-board controls talk to /dev/hidraw
      - hardware-observe        # to notice the mic being plugged in
      - alsa                    # the mic's gain control

parts:
  deep-filter:
    plugin: dump
    source: https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl
    source-type: file
    source-checksum: sha256/70775e251eee44c0f2451a1e833326cf8bcbbe304d3e7cd12851e6fce72ef7da
    organize:
      deep-filter-0.5.6-x86_64-unknown-linux-musl: usr/lib/podstudio/bin/deep-filter
    override-prime: |
      craftctl default
      chmod 755 usr/lib/podstudio/bin/deep-filter

  podstudio:
    after: [deep-filter]
    plugin: nil
    source: .
    stage-packages:
      - python3
      - python3-gi
      - python3-numpy
      - python3-scipy
      - python3-soundfile
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-gstreamer-1.0
      - gir1.2-secret-1
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - libasound2t64
      - libsndfile1
    override-build: |
      install -d $CRAFT_PART_INSTALL/usr/lib/podstudio $CRAFT_PART_INSTALL/bin
      cp -r podstudio $CRAFT_PART_INSTALL/usr/lib/podstudio/podstudio
      find $CRAFT_PART_INSTALL/usr/lib/podstudio -name __pycache__ -type d -prune -exec rm -rf {} +
      install -m755 packaging/snap/podstudio-launch $CRAFT_PART_INSTALL/bin/podstudio-launch
      install -Dm644 data/io.github.thetylerwoodwardproject.PodStudio.metainfo.xml $CRAFT_PART_INSTALL/usr/share/metainfo/io.github.thetylerwoodwardproject.PodStudio.metainfo.xml
      sed 's|@EXEC@|podstudio|; s|^Icon=.*|Icon=${SNAP}/meta/gui/icon.svg|' data/io.github.thetylerwoodwardproject.PodStudio.desktop > data/snap.desktop
      install -Dm644 data/snap.desktop $CRAFT_PART_INSTALL/usr/share/applications/io.github.thetylerwoodwardproject.PodStudio.desktop
      install -Dm644 data/io.github.thetylerwoodwardproject.PodStudio.svg $CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.thetylerwoodwardproject.PodStudio.svg
