# Build:  flatpak run org.flatpak.Builder --user --install --force-clean build-dir packaging/flatpak/io.github.thetylerwoodwardproject.PodStudio.yml
# The python-deps module is generated by packaging/flatpak/gen-wheels.py (pinned wheels with checksums).
app-id: io.github.thetylerwoodwardproject.PodStudio
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: podstudio
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio            # record from the mic, play previews and hotkey sounds
  - --device=all                   # /dev/hidraw for the PodMic's on-board controls, and ALSA for its gain control
  - --share=network                # Buzzsprout uploads
  - --filesystem=xdg-music         # sessions are saved in ~/Music/PodStudio
  - --talk-name=org.freedesktop.secrets   # Buzzsprout token goes in the keyring
modules:
  - python-deps.json
  - name: deep-filter
    buildsystem: simple
    build-commands:
      - install -Dm755 deep-filter /app/lib/podstudio/bin/deep-filter
    sources:
      - type: file
        url: https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl
        sha256: 70775e251eee44c0f2451a1e833326cf8bcbbe304d3e7cd12851e6fce72ef7da
        dest-filename: deep-filter
        only-arches: [x86_64]
  - name: podstudio
    buildsystem: simple
    build-commands:
      - install -d /app/lib/podstudio
      - cp -r podstudio /app/lib/podstudio/podstudio
      - find /app/lib/podstudio -name __pycache__ -type d -prune -exec rm -rf {} +
      - install -Dm755 packaging/flatpak/podstudio /app/bin/podstudio
      - install -Dm644 data/io.github.thetylerwoodwardproject.PodStudio.metainfo.xml /app/share/metainfo/io.github.thetylerwoodwardproject.PodStudio.metainfo.xml
      - install -d /app/share/applications
      - sed 's|@EXEC@|podstudio|' data/io.github.thetylerwoodwardproject.PodStudio.desktop > /app/share/applications/io.github.thetylerwoodwardproject.PodStudio.desktop
      - install -Dm644 data/io.github.thetylerwoodwardproject.PodStudio.svg /app/share/icons/hicolor/scalable/apps/io.github.thetylerwoodwardproject.PodStudio.svg
      - for s in 48 64 128 256 512; do install -Dm644 data/icons/hicolor/${s}x${s}/apps/io.github.thetylerwoodwardproject.PodStudio.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.thetylerwoodwardproject.PodStudio.png; done
      - install -Dm644 data/70-podstudio-podmic.rules /app/share/podstudio/70-podstudio-podmic.rules
    sources:
      - type: dir
        path: ../..
        skip: [.venv, .git, build, dist, packaging/vendor, .pytest_cache, __pycache__, docs]
