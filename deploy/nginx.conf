# Podstudio behind Nginx (install.sh --proxy nginx). install.sh writes this to
# /etc/nginx/sites-available/podstudio with your domain; Certbot then adds the
# HTTPS server block and the redirect from http, and renews the certificate
# with its own timer. The default is Caddy (deploy/Caddyfile), which does all
# of that by itself.

# WebSockets (the live room at /api/ws): pass the upgrade through.
map $http_upgrade $podstudio_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80; # IPv6 (install.sh drops this line where there's none)
    server_name {$DOMAIN};

    # Recording pieces are small (5 s, about 1.4 MB), pad sounds up to 200 MB.
    # Stream uploads to Podstudio instead of spooling them to disk first.
    client_max_body_size 210m;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $podstudio_connection;
        # Podstudio only accepts changes from pages on its own address: keep
        # the Host the browser used (server/origin.ts).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A live session's WebSocket stays open for the whole recording.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
