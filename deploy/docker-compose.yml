# caddy + web + worker, sharing one SQLite file on a named volume. web needs
# deploy/.env (see .env.example — BETTER_AUTH_SECRET, PODSTUDIO_ADMIN_PASSWORD).
# Deliberately NOT included yet (see CHANGELOG + STATUS):
#   - litestream: no off-site backup target has been chosen (BUILD_PLAN §7,
#     "Before Stage 00: independent off-site backup target"). Add its service
#     here once that target exists — don't wire it to nowhere just to look done.
#   - minio / S3: no storage target chosen yet (Stage 02).
#   - livekit: Stage 08.
name: podstudio

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8081:8081" # bootstrap-only: fetch the internal CA root before it's trusted
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/ca:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # env_file loads whatever PODSTUDIO_S3_<KEYREF>_ACCESS_KEY_ID/
    # _SECRET_ACCESS_KEY pairs exist for screen 17's storage targets — their
    # names are only known once Tyler picks key references in the UI, so they
    # can't be a fixed `environment:` entry each. The two vars below stay in
    # `environment` (not just env_file) so compose's `:?` still fails loudly
    # if either is missing.
    env_file:
      - .env
    environment:
      PODSTUDIO_DB_PATH: /data/podstudio.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set this in deploy/.env — see .env.example}
      BETTER_AUTH_URL: https://studio.tylerwoodward.me
      PODSTUDIO_ADMIN_PASSWORD: ${PODSTUDIO_ADMIN_PASSWORD:?set this in deploy/.env — see .env.example}
    volumes:
      - podstudio_data:/data
    expose:
      - "3000"

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      PODSTUDIO_DB_PATH: /data/podstudio.db
    volumes:
      - podstudio_data:/data

volumes:
  podstudio_data:
  caddy_data:
  caddy_config:
