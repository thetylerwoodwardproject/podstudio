# caddy + web + worker, sharing one SQLite file on a named volume. web needs
# deploy/.env (see .env.example — BETTER_AUTH_SECRET, PODSTUDIO_ADMIN_PASSWORD).
# Deliberately NOT included yet (see CHANGELOG + STATUS):
#   - litestream: no off-site backup target has been chosen (BUILD_PLAN §7,
#     "Before Stage 00: independent off-site backup target"). Add its service
#     here once that target exists — don't wire it to nowhere just to look done.
#   - livekit: Stage 08.
name: podstudio

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8081:8081" # bootstrap-only: fetch the internal CA root before it's trusted
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/ca:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      PODSTUDIO_DB_PATH: /data/podstudio.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set this in deploy/.env — see .env.example}
      BETTER_AUTH_URL: https://studio.tylerwoodward.me
      PODSTUDIO_ADMIN_PASSWORD: ${PODSTUDIO_ADMIN_PASSWORD:?set this in deploy/.env — see .env.example}
    volumes:
      - podstudio_data:/data
    expose:
      - "3000"

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      PODSTUDIO_DB_PATH: /data/podstudio.db
    volumes:
      - podstudio_data:/data

  # S3-compatible primary target: Garage, single node, on this box (replaced
  # MinIO 2026-10-25 — MinIO's repo is archived and ships no images). Internal
  # only: no host ports, reachable from web/worker as http://garage:3900.
  # Image is scratch-based: run the CLI as `docker compose exec garage /garage ...`.
  # NOT an off-site backup — it shares this machine's disk.
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set this in deploy/.env — see .env.example}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    expose:
      - "3900"

volumes:
  podstudio_data:
  garage_meta:
  garage_data:
  caddy_data:
  caddy_config:
