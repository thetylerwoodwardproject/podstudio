# Builds the Windows app, runs its tests, and publishes the installer to the GitHub release
# (on a version tag, or a push whose commit message contains [release]).
name: Build Windows app

on:
  push:
    tags: ['v*']
    branches: ['claude/great-darwin-ko99r5']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-windows:
    # The C++ rewrite: one self-contained PodStudio.exe (Direct3D 11 + miniaudio/WASAPI).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: ver
        shell: bash
        run: |
          v="$(cat native/VERSION)"
          r="$(cat native/REVISION 2>/dev/null || echo 1)"
          echo "full=$v-$r" >> "$GITHUB_OUTPUT"
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64
          cmake --build native/build --config Release --target PodStudio core_tests buzz_tests update_tests windows_tests engine_tests --parallel
      - name: Core tests (the C++ must match the Python implementation)
        shell: bash
        run: |
          python -m pip install --quiet numpy scipy soundfile
          python native/tests/make_reference.py native/build/reference > /dev/null
          native/build/Release/core_tests.exe native/build/reference
          native/build/Release/buzz_tests.exe native/build
          native/build/Release/update_tests.exe native/build
          native/build/Release/engine_tests.exe native/build
          native/build/Release/windows_tests.exe native/build
      - name: DeepFilterNet (optional noise reduction)
        shell: bash
        run: |
          mkdir -p dist/native
          cp native/build/Release/PodStudio.exe dist/native/
          ./native/tools/fetch-deepfilter.sh dist/native
          mkdir -p dist/native/licenses
          cp LICENSE NOTICE native/licenses/DeepFilterNet-LICENSE-* native/app/fonts/Inter-OFL.txt dist/native/licenses/
      - name: Smoke test - start the app on each page and capture the window
        shell: pwsh
        run: |
          $env:PODSTUDIO_DEMO = "1"
          $p = Start-Process "$PWD\dist\native\PodStudio.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Host "PodStudio exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "PodStudio is running (responding: $($p.Responding))"
          Stop-Process -Id $p.Id -Force
          ./native/tools/ci-screenshots.ps1 -Exe "$PWD\dist\native\PodStudio.exe" -Pages 0 -Width 600 -Quality 45 -OutDir "$PWD\shots" -NoPrint
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $full = "${{ steps.ver.outputs.full }}"
          iscc "/DVersion=$full" "/DSourceDir=$PWD\dist\native" "/DOutputDir=$PWD\dist" native\installer\podstudio.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path dist\native\* -DestinationPath "dist\PodStudio-$full-x64-portable.zip"
          foreach ($f in @("dist\PodStudio-$full-x64-setup.exe", "dist\PodStudio-$full-x64-portable.zip")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$PWD\$f.sha256", "$h  $(Split-Path $f -Leaf)`n")
          }
          Get-ChildItem dist | Format-Table Name, Length
      - name: Show the screenshot (last, so it is at the end of the log)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path shots\page0.jpg) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("shots\page0.jpg"))
            Write-Host "SCREENSHOT-BEGIN page0 $($b64.Length)"
            for ($i = 0; $i -lt $b64.Length; $i += 2000) { Write-Host $b64.Substring($i, [Math]::Min(2000, $b64.Length - $i)) }
            Write-Host "SCREENSHOT-END page0"
          }
      - name: Publish to the GitHub release (on a version tag, or a push whose commit message contains [release])
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.full) }}
          target_commitish: ${{ github.sha }}
          name: PodStudio v${{ steps.ver.outputs.full }} for Windows
          files: |
            dist/PodStudio-*-x64-setup.exe
            dist/PodStudio-*-x64-setup.exe.sha256
            dist/PodStudio-*-x64-portable.zip
            dist/PodStudio-*-x64-portable.zip.sha256
          body_path: native/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: |
            dist/PodStudio-*-x64-*
            shots/*.png
